[package]
name = "xmtv_api"
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "一个封装好用来解析XMTV的API"
repository = "https://github.com/vintcessun/xmtv_api"

[dependencies]
log = "0.4"
chrono = "0.4"
url = "2.5"
# 0.13 里读 HTTP_PROXY 环境变量是可选 feature `system-proxy`，
# 这里刻意不启用，从依赖层面保证不会走代理。
# TLS 用 rustls（0.13 把 `rustls-tls` 改名成了 `rustls`）。
reqwest = { version = "0.13.4", default-features = false, features = [
    "charset", "http2", "brotli", "gzip", "json", "stream", "rustls",
] }
# 跟随 biliup 钉在 0.8：上游因为 rsa 还没发 0.10 也没法升，
# 升到 0.9 只会让 xidown 里编出两份 rand
rand = "0.8"
anyhow = "1.0"
serde_json = "1.0"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["fs", "time"] }
once_cell = "1.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11"
# 集成测试要自己反序列化 fixtures 里的真实报文（普通依赖不会自动进测试 crate）
serde_json = "1.0"
