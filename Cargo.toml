[package]
name = "xmtv_api"
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "一个封装好用来解析XMTV的API"

[dependencies]
log = "0.4"
chrono = "0.4"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "brotli", "gzip", "json", "rustls-tls", "stream"] }
rand = "0.8.5"
anyhow = "1.0"
serde_json = "1.0"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["fs", "time"] }
once_cell = "1.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11"
